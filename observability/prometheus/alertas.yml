groups:
  - name: api-reservas
    rules:
      - alert: ApiCaida
        expr: up{job="api-reservas"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: La API de reservas no responde a Prometheus
      - alert: TasaErrores5xxAlta
        expr: sum(rate(http_requests_total{status_code=~"5.."}[1m])) / clamp_min(sum(rate(http_requests_total[1m])), 1e-9) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: Más del 5% de las peticiones terminan en error 5xx
      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: La latencia p95 supera 500 ms
      - alert: RedisCaido
        expr: redis_up == 0
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: Redis no está disponible; la API sigue funcionando sin caché
